name: Web checks

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run verify:release
      - name: Retain source-linked local verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-evidence-${{ github.sha }}
          path: |
            test-results/release/*.json
            test-results/e2e-report.json
          retention-days: 7
      - name: Retain browser failure details
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ github.sha }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
